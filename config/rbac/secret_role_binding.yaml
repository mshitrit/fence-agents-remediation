
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # Give this RoleBinding a unique and descriptive name.
  # It's common to append '-system' to avoid conflict with other bindings.
  name: manager-rolebinding-secret
  # This namespace MUST match the namespace you specified in your kubebuilder:rbac marker.
  namespace: system # This is the namespace where the Role exists and where this binding applies.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  # This 'name' MUST match the name of the Role generated in config/rbac/role.yaml.
  # By convention, it's often 'manager-role' or similar.
  name: manager-role
subjects:
  - kind: ServiceAccount
    # This 'name' MUST match the ServiceAccount your operator's controller-manager pod runs as.
    # By convention, it's often 'controller-manager'.
    name: controller-manager
    # This 'namespace' MUST match the namespace where your operator's ServiceAccount is deployed.
    # This is usually the same as the RoleBinding's namespace.
    namespace: system